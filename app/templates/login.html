<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вхід — Fleet Management</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #172033;
        }
        main {
            max-width: 380px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
        }
        input, button {
            box-sizing: border-box;
            width: 100%;
            margin-top: 8px;
            margin-bottom: 16px;
            padding: 12px;
            border: 1px solid #ccd3df;
            border-radius: 7px;
        }
        button {
            background: #2457d6;
            color: white;
            border: 0;
            cursor: pointer;
        }
        .error { color: #b42318; }
        .success { color: #18794e; }
        a { color: #2457d6; }
    </style>
</head>
<body>
<main>
    <h1>Вхід у систему</h1>

    {% if registered %}
        <p class="success">Реєстрація успішна. Можете здійснити вхід.</p>
    {% endif %}

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" action="/login">
        <label for="username">Ім’я користувача</label>
        <input id="username" name="username" required
               autocomplete="username">

        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" required
               autocomplete="current-password">

        <button type="submit">Увійти</button>
    </form>

    <p>Ще немає акаунта? <a href="/register">Зареєструватися</a></p>
    <a href="/">На головну</a>
</main>
</body>
</html>
