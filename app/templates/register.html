<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Реєстрація — Fleet Management</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #172033;
        }
        main {
            max-width: 380px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
        }
        input, button {
            box-sizing: border-box;
            width: 100%;
            margin-top: 8px;
            margin-bottom: 16px;
            padding: 12px;
            border: 1px solid #ccd3df;
            border-radius: 7px;
        }
        button {
            background: #2457d6;
            color: white;
            border: 0;
            cursor: pointer;
        }
        .error { color: #b42318; }
        a { color: #2457d6; }
    </style>
</head>
<body>
<main>
    <h1>Створення акаунта</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" action="/register">
        <label for="username">Ім’я користувача</label>
        <input id="username" name="username" required maxlength="50"
               autocomplete="username">

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required
               autocomplete="email">

        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" required
               minlength="4" autocomplete="new-password">

        <label for="password_confirm">Повторіть пароль</label>
        <input id="password_confirm" name="password_confirm"
               type="password" required minlength="4"
               autocomplete="new-password">

        <button type="submit">Зареєструватися</button>
    </form>

    <p>Вже маєте акаунт? <a href="/login">Увійти</a></p>
    <a href="/">На головну</a>
</main>
</body>
</html>
