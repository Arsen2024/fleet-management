
# DVO-L3-7F2A91
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fleet-management
  labels:
    app: redis
    mascot: kabachok
  annotations:
    devops-lab/mascot-approved: "true"
    devops-lab/mascot: "кабачок"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        mascot: kabachok
      annotations:
        devops-lab/mascot-approved: "true"
        devops-lab/mascot: "кабачок"
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
