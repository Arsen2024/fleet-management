name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Static analysis (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .

  test-main:
    name: Test Fleet Management
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fleet_user
          POSTGRES_PASSWORD: fleet_password
          POSTGRES_DB: fleet_db_sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet_user -d fleet_db_sandbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main service tests
        env:
          ENVIRONMENT: sandbox
          DATABASE_URL: postgresql+asyncpg://fleet_user:fleet_password@localhost:5432/fleet_db_sandbox
          SECRET_KEY: ci-test-secret-key
          SERVICE_API_KEY: ci-test-service-api-key
          DEBUG: "true"
        run: python -m pytest -v tests

  test-telemetry:
    name: Test Telemetry Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run telemetry unit tests
        run: python -m pytest -v telemetry_service/app/tests

  build-main:
    name: Build Fleet Management image
    runs-on: ubuntu-latest
    needs:
      - lint
      - test-main
      - test-telemetry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fleet-management:local .

  build-telemetry:
    name: Build Telemetry image
    runs-on: ubuntu-latest
    needs:
      - lint
      - test-main
      - test-telemetry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f telemetry_service/Dockerfile -t fleet-telemetry:local .
