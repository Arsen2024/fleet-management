name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fleet_user
          POSTGRES_PASSWORD: fleet_password
          POSTGRES_DB: fleet_db_sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet_user -d fleet_db_sandbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run tests
        env:
          ENVIRONMENT: sandbox
          DATABASE_URL: postgresql+asyncpg://fleet_user:fleet_password@localhost:5432/fleet_db_sandbox
          SECRET_KEY: ci-test-secret-key
          DEBUG: "true"
        run: |
          python -m pytest -v
