# DVO-L4-3C8B52
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleet-management.fullname" . }}-telemetry
  labels:
    {{- include "fleet-management.labels" . | nindent 4 }}
  annotations:
    {{- include "fleet-management.annotations" . | nindent 4 }}
spec:
  type: {{ .Values.service.telemetry.type }}
  selector:
    app: {{ include "fleet-management.fullname" . }}-telemetry
  ports:
    - name: http
      port: {{ .Values.service.telemetry.port }}
      targetPort: {{ .Values.service.telemetry.targetPort }}
      protocol: TCP
