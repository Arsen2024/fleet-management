# DVO-L4-3C8B52
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleet-management.fullname" . }}-fleet-postgres
  labels:
    {{- include "fleet-management.labels" . | nindent 4 }}
  annotations:
    {{- include "fleet-management.annotations" . | nindent 4 }}
spec:
  type: {{ .Values.service.fleetPostgres.type }}
  selector:
    app: {{ include "fleet-management.fullname" . }}-fleet-postgres
  ports:
    - name: postgres
      port: {{ .Values.service.fleetPostgres.port }}
      targetPort: 5432
      protocol: TCP
