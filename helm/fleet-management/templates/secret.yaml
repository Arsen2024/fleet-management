# DVO-L4-3C8B52
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleet-management.fullname" . }}-secrets
  labels:
    {{- include "fleet-management.labels" . | nindent 4 }}
  annotations:
    {{- include "fleet-management.annotations" . | nindent 4 }}
type: Opaque
stringData:
  FLEET_DB_PASSWORD: {{ .Values.secrets.fleetDbPassword | quote }}
  TELEMETRY_DB_PASSWORD: {{ .Values.secrets.telemetryDbPassword | quote }}
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  SERVICE_API_KEY: {{ .Values.secrets.serviceApiKey | quote }}
  FLEET_DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s-fleet-postgres:5432/%s" .Values.postgres.fleet.username .Values.secrets.fleetDbPassword (include "fleet-management.fullname" .) .Values.postgres.fleet.database | quote }}
  TELEMETRY_DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s-telemetry-postgres:5432/%s" .Values.postgres.telemetry.username .Values.secrets.telemetryDbPassword (include "fleet-management.fullname" .) .Values.postgres.telemetry.database | quote }}
