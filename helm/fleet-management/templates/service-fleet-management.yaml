# DVO-L4-3C8B52
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleet-management.fullname" . }}
  labels:
    {{- include "fleet-management.labels" . | nindent 4 }}
  annotations:
    {{- include "fleet-management.annotations" . | nindent 4 }}
spec:
  type: {{ .Values.service.fleet.type }}
  selector:
    app: {{ include "fleet-management.fullname" . }}
  ports:
    - name: http
      port: {{ .Values.service.fleet.port }}
      targetPort: {{ .Values.service.fleet.targetPort }}
      protocol: TCP
      {{- if and (eq .Values.service.fleet.type "NodePort") .Values.service.fleet.nodePort }}
      nodePort: {{ .Values.service.fleet.nodePort }}
      {{- end }}
