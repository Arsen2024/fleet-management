# DVO-L4-3C8B52
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fleet-management.fullname" . }}-config
  labels:
    {{- include "fleet-management.labels" . | nindent 4 }}
  annotations:
    {{- include "fleet-management.annotations" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  DEBUG: {{ .Values.config.debug | quote }}
  TELEMETRY_SERVICE_URL: "http://{{ include "fleet-management.fullname" . }}-telemetry:8001"
  REDIS_URL: "redis://{{ include "fleet-management.fullname" . }}-redis:6379/0"
  FLEET_MANAGEMENT_URL: "http://{{ include "fleet-management.fullname" . }}:8000"
