services:
  postgres:
    image: postgres:17
    container_name: fleet_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: fleet_db
      POSTGRES_USER: fleet_user
      POSTGRES_PASSWORD: ${FLEET_DB_PASSWORD:?Set FLEET_DB_PASSWORD in .env.sandbox}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - fleet_network

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fleet_user -d fleet_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  telemetry_postgres:
    image: postgres:17
    container_name: telemetry_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: telemetry_db
      POSTGRES_USER: telemetry_user
      POSTGRES_PASSWORD: ${TELEMETRY_DB_PASSWORD:?Set TELEMETRY_DB_PASSWORD in .env.sandbox}

    ports:
      - "5433:5432"

    volumes:
      - telemetry_postgres_data:/var/lib/postgresql/data

    networks:
      - fleet_network

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U telemetry_user -d telemetry_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: fleet_redis
    restart: unless-stopped

    networks:
      - fleet_network

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  fleet1:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      ENVIRONMENT: sandbox
      DATABASE_URL: postgresql+asyncpg://fleet_user:${FLEET_DB_PASSWORD}@postgres:5432/fleet_db_sandbox
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.sandbox}
      SERVICE_API_KEY: ${SERVICE_API_KEY:?Set SERVICE_API_KEY in .env.sandbox}
      TELEMETRY_SERVICE_URL: http://telemetry:8001
      REDIS_URL: redis://redis:6379/0
      DEBUG: ${DEBUG:-false}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - fleet_network

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  fleet2:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      ENVIRONMENT: sandbox
      DATABASE_URL: postgresql+asyncpg://fleet_user:${FLEET_DB_PASSWORD}@postgres:5432/fleet_db_sandbox
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.sandbox}
      SERVICE_API_KEY: ${SERVICE_API_KEY:?Set SERVICE_API_KEY in .env.sandbox}
      TELEMETRY_SERVICE_URL: http://telemetry:8001
      REDIS_URL: redis://redis:6379/0
      DEBUG: ${DEBUG:-false}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - fleet_network

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  fleet3:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      ENVIRONMENT: sandbox
      DATABASE_URL: postgresql+asyncpg://fleet_user:${FLEET_DB_PASSWORD}@postgres:5432/fleet_db_sandbox
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.sandbox}
      SERVICE_API_KEY: ${SERVICE_API_KEY:?Set SERVICE_API_KEY in .env.sandbox}
      TELEMETRY_SERVICE_URL: http://telemetry:8001
      REDIS_URL: redis://redis:6379/0
      DEBUG: ${DEBUG:-false}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - fleet_network

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: fleet_nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      fleet1:
        condition: service_healthy
      fleet2:
        condition: service_healthy
      fleet3:
        condition: service_healthy

    networks:
      - fleet_network

  telemetry:
    build:
      context: .
      dockerfile: telemetry_service/Dockerfile

    container_name: fleet_telemetry

    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+asyncpg://telemetry_user:${TELEMETRY_DB_PASSWORD}@telemetry_postgres:5432/telemetry_db
      FLEET_MANAGEMENT_URL: http://nginx:80
      SERVICE_API_KEY: ${SERVICE_API_KEY:?Set SERVICE_API_KEY in .env.sandbox}
      DEBUG: ${DEBUG:-false}

    ports:
      - "8001:8001"

    depends_on:
      telemetry_postgres:
        condition: service_healthy
      nginx:
        condition: service_started

    networks:
      - fleet_network

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
    external: true
    name: fleet-management_postgres_data

  telemetry_postgres_data:
    external: true
    name: fleet-management_telemetry_postgres_data

networks:
  fleet_network:
    driver: bridge